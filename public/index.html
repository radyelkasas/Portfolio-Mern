<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشئ عالمك الخاص</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #FF6B6B;
            --secondary-color: #4ECDC4;
            --accent-color: #FFE66D;
            --background-gradient: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
        }

        .navbar-brand {
            font-size: 2rem;
            color: var(--primary-color) !important;
            text-shadow: 2px 2px 0 #fff;
        }

        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 1.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 25px;
            padding: 0.8rem 2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #ff8585;
            border-color: #ff8585;
            transform: scale(1.05);
        }

        .section-card {
            position: relative;
            overflow: hidden;
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--primary-color);
            border-top: 5px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-star me-2"></i>
                انشئ عالمك الخاص
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">الملف الشخصي</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="stats.html">الإحصائيات</a>
                    </li>
                </ul>
                <button class="btn btn-outline-danger" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>
                    تسجيل الخروج
                </button>
            </div>
        </div>
    </nav>
    <!-- Main Container -->
    <div class="container py-4">
        <!-- Form Card -->
        <div class="card mb-5">
            <div class="card-header">
                <h3 class="mb-0" id="formTitle">✨ إضافة قسم جديد</h3>
            </div>
            <div class="card-body">
                <form id="sectionForm">
                    <input type="hidden" id="sectionId">
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-paint-brush text-primary"></i>
                            العنوان
                        </label>
                        <input type="text" class="form-control" id="title" required>
                        <div class="invalid-feedback">
                            يرجى إدخال العنوان
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-edit text-primary"></i>
                            المحتوى
                        </label>
                        <textarea class="form-control" id="content" rows="4" required></textarea>
                        <div class="invalid-feedback">
                            يرجى إدخال المحتوى
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="fas fa-palette text-primary"></i>
                                لون الخلفية
                            </label>
                            <input type="color" class="form-control form-control-color w-100" id="backgroundColor"
                                value="#ffffff">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="fas fa-sort-numeric-up text-primary"></i>
                                الترتيب
                            </label>
                            <input type="number" class="form-control" id="order" min="1" value="1">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-image text-primary"></i>
                            رابط الصورة
                        </label>
                        <input type="url" class="form-control" id="imageUrl">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1" id="submitBtn">
                            <i class="fas fa-magic me-2"></i>
                            إضافة القسم
                        </button>
                        <button type="button" class="btn btn-secondary d-none" id="cancelBtn">
                            <i class="fas fa-times me-2"></i>
                            إلغاء
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Sections Grid -->
        <div class="row g-4" id="sectionsContainer"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3"></div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // التحقق من المصادقة
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }
        }

        // إضافة التوكن إلى كل طلب API
        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('token');
            return fetch(url, {
                ...options,
                headers: {
                    ...options.headers,
                    'Authorization': `Bearer ${token}`
                }
            });
        }
        let isEditing = false;

        // Show loading
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        // Hide loading
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Show toast message
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container');
            const toastHtml = `
                <div class="toast align-items-center text-white bg-${type} border-0" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHtml);
            const toast = new bootstrap.Toast(toastContainer.lastElementChild);
            toast.show();

            // Remove toast after it's hidden
            toastContainer.lastElementChild.addEventListener('hidden.bs.toast', function () {
                this.remove();
            });
        }

        // Reset form
        function resetForm() {
            document.getElementById('sectionForm').reset();
            document.getElementById('sectionId').value = '';
            document.getElementById('formTitle').textContent = '✨ إضافة قسم جديد';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-magic me-2"></i>إضافة القسم';
            document.getElementById('cancelBtn').classList.add('d-none');
            isEditing = false;
        }

        // Load sections
        async function loadSections() {
            try {
                showLoading();
                const response = await fetchWithAuth(`${API_URL}/sections`);
                if (!response.ok) throw new Error('فشل في تحميل الأقسام');

                const sections = await response.json();
                const container = document.getElementById('sectionsContainer');
                container.innerHTML = sections.map(section => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card section-card" style="background-color: ${section.backgroundColor}">
                            ${section.imageUrl ? `<img src="${section.imageUrl}" class="card-img-top" alt="${section.title}">` : ''}
                            <div class="card-body">
                                <h5 class="card-title">${section.title}</h5>
                                <p class="card-text">${section.content}</p>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-primary" onclick="editSection('${section._id}')">
                                        <i class="fas fa-edit"></i>
                                        تعديل
                                    </button>
                                    <button class="btn btn-danger" onclick="deleteSection('${section._id}')">
                                        <i class="fas fa-trash"></i>
                                        حذف
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                if (error.response?.status === 401) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        // Add/Edit section
        async function handleSubmit(event) {
            event.preventDefault();
            const formData = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                backgroundColor: document.getElementById('backgroundColor').value,
                imageUrl: document.getElementById('imageUrl').value,
                order: parseInt(document.getElementById('order').value)
            };

            try {
                showLoading();
                const sectionId = document.getElementById('sectionId').value;
                const url = `${API_URL}/sections${sectionId ? `/${sectionId}` : ''}`;
                const method = sectionId ? 'PUT' : 'POST';

                // تأكد من إرسال token التوثيق
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}` // إضافة هذا السطر
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'حدث خطأ أثناء حفظ القسم');
                }

                const result = await response.json();
                showToast(result.message);
                resetForm();
                loadSections();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }
        // Edit section
        // دالة جلب تفاصيل القسم
        async function fetchSection(id) {
            try {
                showLoading();
                const response = await fetch(`${API_URL}/sections/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message);
                }

                const section = await response.json();

                // تعبئة النموذج بالبيانات
                document.getElementById('sectionId').value = section._id;
                document.getElementById('title').value = section.title;
                document.getElementById('content').value = section.content;
                document.getElementById('backgroundColor').value = section.backgroundColor || '#ffffff';
                document.getElementById('imageUrl').value = section.imageUrl || '';
                document.getElementById('order').value = section.order || 1;

                // تغيير حالة النموذج إلى وضع التعديل
                document.getElementById('formTitle').textContent = '✏️ تعديل القسم';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save me-2"></i>حفظ التغييرات';
                document.getElementById('cancelBtn').classList.remove('d-none');

                // التمرير إلى النموذج
                document.getElementById('sectionForm').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        // تحديث دالة editSection لتستخدم fetchSection
        function editSection(id) {
            fetchSection(id);
        }
        // Delete section
        async function deleteSection(id) {
            if (!confirm('هل أنت متأكد من حذف هذا القسم؟')) return;

            try {
                showLoading();
                const response = await fetchWithAuth(`${API_URL}/sections/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('فشل في حذف القسم');

                const result = await response.json();
                showToast(result.message);
                loadSections();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        // Event Listeners
        document.getElementById('sectionForm').addEventListener('submit', handleSubmit);
        document.getElementById('cancelBtn').addEventListener('click', resetForm);

        // دالة تسجيل الخروج
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // التحقق من المصادقة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadSections();
        });

        // Create confetti effect
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: 10px;
                    height: 10px;
                    background: ${['#FF6B6B', '#FFE66D', '#4ECDC4'][Math.floor(Math.random() * 3)]};
                    top: -10px;
                    left: ${Math.random() * 100}vw;
                    transform: rotate(${Math.random() * 360}deg);
                    pointer-events: none;
                    z-index: 1000;
                `;

                // Add falling animation
                confetti.animate([
                    { transform: `translate(${Math.random() * 200 - 100}px, -10px) rotate(0deg)` },
                    { transform: `translate(${Math.random() * 400 - 200}px, ${window.innerHeight + 10}px) rotate(${360 + Math.random() * 360}deg)` }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    easing: 'cubic-bezier(.37,0,.67,1)'
                });

                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        // Add form validation
        function validateForm() {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const order = document.getElementById('order').value;

            if (!title) {
                showToast('يرجى إدخال عنوان القسم', 'danger');
                return false;
            }

            if (!content) {
                showToast('يرجى إدخال محتوى القسم', 'danger');
                return false;
            }

            if (order < 1) {
                showToast('يجب أن يكون الترتيب رقماً موجباً', 'danger');
                return false;
            }

            return true;
        }

        // Update section order
        async function updateSectionOrder(id, newOrder) {
            try {
                showLoading();
                const response = await fetch(`${API_URL}/sections/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ order: newOrder })
                });

                if (!response.ok) throw new Error('فشل في تحديث ترتيب القسم');

                await loadSections();
            } catch (error) {
                showToast(error.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        // Show section details
        function showSectionDetails(section) {
            const detailsModal = new bootstrap.Modal(document.getElementById('sectionDetailsModal'));
            document.getElementById('modalTitle').textContent = section.title;
            document.getElementById('modalContent').textContent = section.content;
            document.getElementById('modalImage').src = section.imageUrl || '/api/placeholder/400/300';
            document.getElementById('modalCreatedAt').textContent = new Date(section.createdAt).toLocaleDateString('ar-SA');
            document.getElementById('modalUpdatedAt').textContent = new Date(section.updatedAt).toLocaleDateString('ar-SA');
            detailsModal.show();
        }

        // Handle network errors
        window.addEventListener('offline', () => {
            showToast('لا يوجد اتصال بالإنترنت', 'danger');
        });

        window.addEventListener('online', () => {
            showToast('تم استعادة الاتصال بالإنترنت', 'success');
            loadSections();
        });

        // Add error boundary
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\nError object: ' + JSON.stringify(error));
            showToast('حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.', 'danger');
            hideLoading();
            return false;
        };
    </script>

    <!-- Section Details Modal -->
    <div class="modal fade" id="sectionDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img id="modalImage" class="img-fluid rounded mb-3" alt="صورة القسم">
                    <p id="modalContent" class="mb-3"></p>
                    <div class="d-flex justify-content-between text-muted">
                        <small>تاريخ الإنشاء: <span id="modalCreatedAt"></span></small>
                        <small>آخر تحديث: <span id="modalUpdatedAt"></span></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
