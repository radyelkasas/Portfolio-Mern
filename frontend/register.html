<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - انشئ عالمك الخاص</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .register-title {
            color: #FF6B6B;
            text-align: center;
            margin-bottom: 2rem;
            font-weight: bold;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 2px solid #eee;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #FF6B6B;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 107, 0.25);
        }

        .btn-register {
            background: #FF6B6B;
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            color: white;
            font-weight: bold;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background: #ff8585;
            transform: translateY(-2px);
        }

        .btn-back {
            background: transparent;
            border: 2px solid #FF6B6B;
            color: #FF6B6B;
            margin-top: 1rem;
        }

        .btn-back:hover {
            background: #fff3f3;
            color: #FF6B6B;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin-top: 1rem;
            display: none;
            padding: 0.5rem;
            border-radius: 5px;
            background-color: #ffe6e6;
        }

        .success-message {
            color: #198754;
            text-align: center;
            margin-top: 1rem;
            display: none;
            padding: 0.5rem;
            border-radius: 5px;
            background-color: #e8f8f0;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }

        .loading-spinner i {
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }

        .strength-weak {
            color: #dc3545;
        }

        .strength-medium {
            color: #ffc107;
        }

        .strength-strong {
            color: #198754;
        }

        .input-group-text {
            background-color: transparent;
            cursor: pointer;
            border: 2px solid #eee;
            border-right: none;
        }

        .form-control.password {
            border-right: none;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h2 class="register-title">
            <i class="fas fa-star-half-alt me-2"></i>
            إنشاء حساب جديد
        </h2>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user text-primary me-2"></i>
                    اسم المستخدم
                </label>
                <input type="text" class="form-control" id="username" required minlength="3" pattern="[A-Za-z0-9_]+"
                    title="يجب أن يحتوي على أحرف وأرقام فقط">
                <div class="form-text">يجب أن يكون 3 أحرف على الأقل</div>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-envelope text-primary me-2"></i>
                    البريد الإلكتروني
                </label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-lock text-primary me-2"></i>
                    كلمة المرور
                </label>
                <div class="input-group">
                    <input type="password" class="form-control password" id="password" required minlength="6">
                    <span class="input-group-text" onclick="togglePassword()">
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </span>
                </div>
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-lock text-primary me-2"></i>
                    تأكيد كلمة المرور
                </label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>

            <div class="loading-spinner" id="loadingSpinner">
                <i class="fas fa-circle-notch fa-spin fa-2x"></i>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <button type="submit" class="btn btn-register">
                <i class="fas fa-user-plus me-2"></i>
                إنشاء الحساب
            </button>

            <button type="button" class="btn btn-register btn-back" onclick="window.location.href='login.html'">
                <i class="fas fa-arrow-right me-2"></i>
                العودة لتسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // Check password strength
        function checkPasswordStrength(password) {
            const strengthDiv = document.getElementById('passwordStrength');
            const hasNumber = /\d/.test(password);
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            const strength =
                (hasNumber ? 1 : 0) +
                (hasUpper ? 1 : 0) +
                (hasLower ? 1 : 0) +
                (hasSpecial ? 1 : 0);

            if (password.length < 6) {
                strengthDiv.innerHTML = '<i class="fas fa-times-circle"></i> كلمة المرور قصيرة جداً';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength < 2) {
                strengthDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> ضعيفة';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength < 3) {
                strengthDiv.innerHTML = '<i class="fas fa-info-circle"></i> متوسطة';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                strengthDiv.innerHTML = '<i class="fas fa-check-circle"></i> قوية';
                strengthDiv.className = 'password-strength strength-strong';
            }
        }

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // Show/hide messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        // Handle form submission
        async function register(username, email, password) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            loadingSpinner.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'حدث خطأ أثناء إنشاء الحساب');
                }

                showSuccess('تم إنشاء الحساب بنجاح! جاري تحويلك لصفحة تسجيل الدخول...');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                showError(error.message);
            } finally {
                loadingSpinner.style.display = 'none';
            }
        }

        // Form validation and submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validate username
            if (username.length < 3) {
                showError('يجب أن يكون اسم المستخدم 3 أحرف على الأقل');
                return;
            }

            // Validate email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('البريد الإلكتروني غير صالح');
                return;
            }

            // Validate password
            if (password.length < 6) {
                showError('يجب أن تكون كلمة المرور 6 أحرف على الأقل');
                return;
            }

            if (password !== confirmPassword) {
                showError('كلمتا المرور غير متطابقتين');
                return;
            }

            await register(username, email, password);
        });

        // Check password strength on input
        document.getElementById('password').addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });
    </script>
</body>

</html>
